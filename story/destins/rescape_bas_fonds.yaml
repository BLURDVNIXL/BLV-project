  - id: re_5_ceremonie
    jalon: 5
    jour: 304
    denouement: true
    lieu: "Bord de la lagune, première pierre"
    moment: "Cérémonie d'inauguration"
    objectif: "Dire ce que ces jours t'ont fait : le septième, ou le premier d'une autre vie."
    present: [lea, sanogo, moussa, fatou, aya]
    savoir: "Tu sais ce que tu as pris, ce que tu as rendu, et ce qu'il te reste à tenir demain."
    dialogue:
      - {narr: "Le Maire coupe le ruban d'un quartier à moitié vrai. Tu es là, debout, avec Léa. Ce n'est pas la fin : c'est un jour de plus."}
      - {qui: sanogo, dit: "Je ne te félicite pas d'être guéri. Je te félicite d'être venu à chaque rendez-vous.", si: "flags.suivi_clinique"}
      - {qui: lea, dit: "Grand frère. Tu es là. Ça me suffit pour aujourd'hui.", si: "relations.lea.trust >= 1"}

fins:
  - id: re_f_lum
    type: lumiere
    priorite: 2
    si: "flags.temoin and compromission <= 0 and flags.moussa_sauve and preuves.cahier_moussa == 'transmise'"
    titre: "Le Témoin Libéré"
    resume: "Ton témoignage fait tomber des noms, et tu restes debout."
    epilogue:
      - {txt: "Le cahier de Moussa ouvre trois enquêtes : les noms, les dates, les fournisseurs sont devant le juge. Ceux qui vendaient à Koumassi ne vendent plus."}
      - {si: "flags.rechute", txt: "Tu as rechuté, au moins une fois. Tu es revenu. Sanogo ne l'a jamais compté contre toi."}
      - {si: "flags.pair_aidant", txt: "Tu es relais à la clinique de Sanogo, deux matins par semaine. Tu t'assois à côté de ceux que le quartier évite."}
      - {si: "relations.lea.trust >= 3", txt: "Léa a ouvert son propre étal à côté de celui de leur mère. Elle a gardé la couverture de la première nuit."}
      - {txt: "Ce n'est pas gratuit : Sékou n'a pas fini de te chercher, et tu comptes tes jours un à un."}
  - id: re_f_ombre
    type: ombre
    priorite: 3
    si: "flags.poste_sekou and compromission >= 8"
    titre: "Le Lieutenant de Rue"
    resume: "Tu tiens ton poste. Léa ne te rend plus visite."
    epilogue:
      - {txt: "Tu tiens ton poste pour Sékou : un toit, des quotas, des nuits sans fin. Tu as l'argent. Tu n'as plus de chambre à toi."}
      - {si: "flags.lea_laissee", txt: "Léa a guéri sans toi, à l'hôpital, sous la fièvre. Elle ne t'a pas pardonné de n'avoir pas été là."}
      - {si: "flags.moussa_perdu", txt: "La mère de Moussa ne cherche plus son fils. Tu sais pourquoi, tu ne le dis à personne."}
      - {txt: "Les jours passent. Aucun n'est le septième."}
  - id: re_f_entre
    type: entre_deux
    priorite: 5
    si: "true"
    titre: "Les Jours qui Restent"
    resume: "Tu tombes, tu te relèves. Un jour à la fois."
    epilogue:
      - {txt: "Tu tombes, tu te relèves. Il y a des semaines où tu tiens, d'autres où tu ne tiens pas. Léa est là pour les deux."}
      - {si: "flags.suivi_clinique", txt: "Tu retournes à la clinique chaque fois que tu en as besoin, sans te dire que tu as échoué."}
      - {si: "flags.rechute", txt: "Tu as rechuté, et Sanogo ne t'a jamais fermé la porte."}
      - {si: "flags.silence", txt: "Tu n'as rien dit à Aya. Chaque matin, tu te demandes si les noms que tu connais appartiennent à ta vie ou à celle des autres."}
      - {si: "flags.moussa_perdu", txt: "Tu ne sais pas ce qu'est devenu Moussa. Tu le cherches parfois dans la foule."}
  - id: re_f_trag
    type: tragique
    priorite: 1
    imposee: true
    si: "flags.trahi_sekou and flags.sans_protection and flags.lea_vue"
    titre: "Le Témoin Réduit au Silence"
    resume: "Tu as parlé, sans protection, et ils savaient déjà où te trouver."
    epilogue:
      - {txt: "Les hommes de Sékou avaient vu Léa à Rue Princesse : ils savaient où elle habitait, donc où tu dormais."}
      - {txt: "Tu as parlé à Aya sans mandat, sans protection, devant des hommes qui connaissaient ta chambre."}
      - {txt: "Le jour de la cérémonie, la chambre de Koumassi est vide. Sékou n'avait plus besoin de toi, et te savait plus dangereux vivant. Léa, elle, vit. Fin définitive."}
  - id: re_f_secret
    type: secrete
    priorite: 0
    si: "flags.pair_aidant and flags.temoin and flags.moussa_sauve and relations.lea.trust >= 3 and relations.sanogo.trust >= 3"
    titre: "Le Phénix de Koumassi"
    resume: "Tu aides d'autres à sortir comme tu es sorti."
    epilogue:
      - {txt: "La clinique de Sanogo a une deuxième salle. Tu y animes le groupe du jeudi, une chaise en cercle pour chacun."}
      - {txt: "Moussa vient quand il peut. Léa tient l'étal à côté, et sert du bissap aux visiteurs."}
      - {si: "flags.rechute", txt: "Tu dis aux nouveaux que tu as rechuté, et que tu es revenu. C'est la seule chose que tu leur promets."}
      - {txt: "Tu n'es pas guéri. Tu es là, aujourd'hui, pour que d'autres le soient demain."}
