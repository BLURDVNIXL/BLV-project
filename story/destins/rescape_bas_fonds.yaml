destin: rescape_bas_fonds
titre: "Sept Jours vers la Lumière"
rarete: legendaire
genre: libre
resume: "Ancien revendeur de rue à Koumassi, tu entames un sevrage avec ta sœur Léa à tes côtés. Sékou t'offre de quoi tenir, le docteur Sanogo t'offre un groupe de parole, et un jeune du quartier, Moussa, dépend de ce que tu feras. Il n'y a pas de guérison en sept jours : il y a des jours, un à la fois."
themes: [sevrage, reduction_des_risques, fraternite, temoignage]
fonction_dramatique: >-
  Le Rescapé est le seul protagoniste qui voit la Cité Lagune-Nord depuis le corps : une santé
  fragile, une chambre à Koumassi, un réseau qui sait où il dort. Il connaît les fournisseurs, donc
  les noms. Son arc n'est pas de « guérir » mais de tenir, de rechuter peut-être, et de décider
  ce qu'il fait de ce qu'il sait pour que Moussa, lui, s'en sorte.

depart:
  camp: ombre
  compromission: 5
  argent_fcfa: 20000
  etoile: 40
  sante: 45
  energie: 50
  metier: dealer_rue
  echelon: revendeur
  ecole: aucune
  diplomes: []
  charges_mensuelles: 80000      # chambre, repas, remboursements de petites dettes
  logement_descriptif: "Une chambre à Koumassi"
  competences: {terrain: 4, negoce: 2}
  relations:
    lea: {trust: 2}
    sanogo: {trust: 1}
    sekou: {trust: 1}
  factions:
    ombre: {reputation: 1}
    ordre: {exposition: 1}

cercle:
  - {id: lea, nom: "Léa, ta sœur", rel: proche}
  - {id: sanogo, nom: "Docteur Sanogo", rel: allie}
  - {id: moussa, nom: "Moussa, un jeune du quartier", rel: neutre}
  - {id: sekou, nom: "Sékou, ton ancien fournisseur", rel: rival}
  - {id: aya, nom: "Lieutenante Aya Coulibaly", rel: neutre}
  - {id: fatou, nom: "Fatou Bamba", rel: allie}

flags: [sevrage_accompagne, groupe, suivi_clinique, tenu_seul, rechute, poste_sekou, moussa_sauve, moussa_perdu,
        parole_publique, pair_aidant, coupe_sekou, lea_vue, temoin, trahi_sekou, sans_protection, protection_aya,
        loyal_sekou, silence, lea_evacuee, lea_laissee, aide_voisins]
faits: [veillee, tenu]
preuves: [cahier_moussa]
actifs: []

# --------------------------------------------------------------------------- événements
evenements:
  - id: re_ev_rechute
    jour: 60
    si: "not flags.groupe"
    txt: "Une nuit, tu retombes. Léa te retrouve au matin, ne dit rien, ouvre la fenêtre, fait chauffer de l'eau et reste. Ce n'est pas la fin : c'est un jour de plus à reprendre."
    eff: {flags: [rechute], sante: -5, relations: {lea: {peur: 1}}}
    sinon_txt: "Le groupe organise une veillée. Le docteur Sanogo te dit : « Une rechute n'est pas une fin. Ce qui compte, c'est que tu viennes demain. »"
    sinon_eff: {relations: {sanogo: {trust: 1}}}
  - id: re_ev_sekou
    jour: 120
    si: "flags.poste_sekou"
    txt: "Sékou augmente tes quotas : « Les temps sont durs, mon frère. » Il sait que tu ne peux pas refuser sans perdre ton toit."
    eff: {compromission: 1, relations: {sekou: {trust: 1}}}
    sinon_txt: "Deux hommes de Sékou passent devant la clinique de Sanogo, à pied, trois jours de suite. Ils ne s'arrêtent pas. Léa les a vus."
    sinon_eff: {relations: {lea: {peur: 1}}}
  - id: re_ev_lea
    jour: 170
    si: "relations.lea.trust <= 1"
    txt: "Léa a trouvé une place chez sa tante, à Bouaké. Elle t'a laissé un mot sur la table : « Je reviens quand tu seras là, vraiment. »"
    eff: {relations: {lea: {trust: -1}}}
    sinon_txt: "Léa te confie la clé de l'étal de leur mère : « Tu m'aides le matin, et on verra le reste. »"
    sinon_eff: {relations: {lea: {trust: 1}}}
  - id: re_ev_moussa
    jour: 230
    si: "flags.moussa_sauve"
    txt: "Moussa, sorti de l'hôpital, passe te voir avec un cahier d'écolier : « Les noms de ceux qui m'ont vendu, avec les dates. Je ne sais pas à qui le donner. Toi, tu sauras. »"
    eff: {preuves: {cahier_moussa: {action: obtenir}}, relations: {moussa: {trust: 1}}}
    sinon_txt: "La mère de Moussa te cherche dans le quartier. Elle ne crie pas. Elle demande seulement si tu sais où est son fils."
    sinon_eff: {flags: [moussa_perdu], relations: {sanogo: {trust: -1}}}
  - id: re_ev_clinique
    jour: 283
    si: "relations.sanogo.trust >= 2"
    txt: "À l'aube, Sanogo ouvre la clinique à tous les sinistrés de Koumassi, y compris à ceux que le quartier regardait de travers. Il t'attend avec une blouse en trop : « Viens, si tu veux aider. »"
    eff: {etoile_mod: {valeur: 5, jours: 30}, relations: {sanogo: {trust: 1}}}
    sinon_txt: "La clinique est débordée. Sanogo, seul, n'a plus de temps pour personne."
    sinon_eff: {relations: {sanogo: {trust: -1}}}

# --------------------------------------------------------------------------- nœuds
noeuds:
  - id: re_0_chambre
    jalon: 0
    jour: 1
    lieu: "Koumassi, chambre"
    moment: "Matin, premier jour sans"
    objectif: "Installer le sevrage sans l'esthétiser : un corps fragile, une sœur qui reste, un téléphone qui sonne."
    present: [lea]
    savoir: "Tu tiens depuis hier soir. Ton corps proteste. Tu sais que d'autres ont essayé et ont lâché."
    dialogue:
      - {narr: "La chambre sent la sueur froide et le savon. Léa pose sur la table un bol de riz, une bouteille d'eau, une vieille couverture."}
      - {qui: lea, dit: "Tiens bon, grand frère. Je reste. Je ne te demande pas de promettre, juste de manger."}
      - {qui: radio, dit: "… la future Cité Lagune-Nord offrira des milliers d'emplois aux jeunes de la ville …"}
    choix:
      - id: manger
        l: "Manger ce que Léa t'apporte et rester allongé"
        intention: "Tenir d'abord avec ce que tu as"
        cout: "Une journée vide, et le téléphone qui vibre sans toi."
        eff: {relations: {lea: {trust: 2}}, energie: 5}
        vers: re_0_septjours
      - id: appeler_sanogo
        l: "Appeler le docteur Sanogo, dont Léa t'a laissé le numéro"
        intention: "Ne pas tenir seul"
        cout: "Admettre que tu as besoin de quelqu'un."
        eff: {flags: [sevrage_accompagne], relations: {sanogo: {trust: 2}}}
        vers: re_0_septjours
      - id: voir_sekou
        l: "Aller voir Sékou, « juste pour lui dire que tu arrêtes »"
        intention: "Régler ça face à face"
        cout: "Une ruelle de Koumassi n'a jamais aidé personne à tenir."
        vu_par: [ombre]
        eff: {compromission: 1, relations: {sekou: {trust: 1}, lea: {trust: -1}}, factions: {ombre: {reputation: 1}}}
        vers: re_0_septjours

  - id: re_0_septjours
    jalon: 0
    jour: 8
    lieu: "Koumassi, clinique du docteur Sanogo"
    moment: "Septième jour"
    objectif: "Le septième jour : ni victoire, ni catastrophe. Une porte, que tu peux ouvrir ou laisser."
    present: [sanogo, lea]
    savoir: "Sanogo ne te promet rien. Il te propose un suivi, un groupe de parole, des gestes pour limiter les risques."
    dialogue:
      - {narr: "Une salle claire, des chaises disposées en cercle, un ventilateur qui grince. Sanogo pose une trousse sur la table et te laisse la regarder."}
      - {qui: sanogo, dit: "Sept jours, c'est un début, pas une fin. Je ne te demande pas d'être parfait. Je te propose un suivi, et un groupe. Et si tu retombes, tu reviens, c'est tout."}
      - {qui: sanogo, dit: "Un jour tu pourras peut-être aider quelqu'un d'autre à passer ce même cap. Pas aujourd'hui."}
    choix:
      - id: groupe
        l: "Entrer dans le groupe de parole"
        intention: "Ne plus être le seul à savoir ce que c'est"
        cout: "Parler à voix haute devant des inconnus."
        eff: {flags: [groupe, suivi_clinique], energie: -5, relations: {sanogo: {trust: 2}, lea: {trust: 1}}}
        vers: re_1_sekou
      - id: suivi
        l: "Accepter seulement le suivi médical, sans le groupe"
        intention: "Une aide sans t'exposer"
        cout: "Tu portes le reste seul."
        eff: {flags: [suivi_clinique], relations: {sanogo: {trust: 1}}}
        vers: re_1_sekou
      - id: seul
        l: "Remercier et tenir vingt-quatre heures seul"
        intention: "Prouver que tu peux"
        cout: "Prouver quoi, et à qui ?"
        eff: {flags: [tenu_seul]}
        tirage:
          difficulte: 4
          issues:
            miracle: {vers: re_1_sekou, eff: {relations: {lea: {trust: 1, fait: tenu}}}, txt: "Tu tiens. Léa pleure sans bruit, et ne dit rien pour ne pas casser ça."}
            normal: {vers: re_1_sekou, eff: {sante: -5}, txt: "Tu tiens à moitié. Tu trembles toute la nuit, mais tu es encore là le matin."}
            mauvaise: {vers: re_1_sekou, eff: {flags: [rechute], sante: -10, relations: {lea: {peur: 1}}}, txt: "Tu retombes. Léa te retrouve, ne dit rien, et reste. Ce n'est pas une fin, c'est un jour à reprendre."}

  - id: re_1_sekou
    jalon: 1
    jour: 40
    lieu: "Koumassi, ruelle"
    moment: "Soir"
    objectif: "Sékou te propose de quoi tenir : un poste, une avance, et un toit que tu risques de perdre."
    present: [sekou]
    savoir: "Sékou connaît ta chambre, ta sœur, ta santé. Il ne menace pas : il offre."
    dialogue:
      - {narr: "Sékou t'attend sous le lampadaire cassé, les mains dans les poches, sans un geste brusque."}
      - {qui: sekou, dit: "Mon frère. Tu connais le terrain mieux que personne. Un poste, trente mille francs d'avance, et on oublie le reste. Tu n'as pas à choisir entre ta sœur et nous."}
      - {qui: sekou, dit: "Je ne dis pas que tu dois dire oui. Je dis que la porte est ouverte."}
    choix:
      - id: accepter_poste
        l: "Accepter le poste et l'avance de 30 000 F"
        intention: "Un toit, un revenu, une protection"
        cout: "Tu retournes là où tu es tombé."
        vu_par: [ombre]
        eff: {compromission: 3, argent: 30000, flags: [poste_sekou], factions: {ombre: {reputation: 2}}, relations: {sekou: {trust: 2}, lea: {trust: -1}}}
        vers: re_1_moussa
      - id: refuser_poste
        l: "Refuser, même si ça te laisse sans revenu"
        intention: "Ne pas retourner là-dedans"
        cout: "Un loyer à payer et personne pour t'avancer quoi que ce soit."
        vu_par: [ombre]
        eff: {compromission: -1, flags: [coupe_sekou], factions: {ombre: {exposition: 1}}, relations: {sekou: {peur: 1}, lea: {trust: 1}}}
        vers: re_1_moussa
      - id: reflechir
        l: "Dire que tu y penses, sans promettre"
        intention: "Gagner du temps"
        cout: "Sékou n'aime pas attendre."
        vu_par: [ombre]
        tirage:
          difficulte: 4
          issues:
            miracle: {vers: re_1_moussa, eff: {relations: {sekou: {trust: 1}}}, txt: "Sékou hoche la tête : « Pense, mon frère. La porte reste ouverte. »"}
            normal: {vers: re_1_moussa, eff: {compromission: 1}, txt: "Sékou te serre l'épaule : « Je repasse la semaine prochaine. »"}
            mauvaise: {vers: re_1_moussa, eff: {compromission: 2, flags: [poste_sekou], argent: 30000}, txt: "Sékou glisse l'avance dans ta poche avant que tu ne protestes : « Je prends ton silence pour un oui. »"}

  - id: re_1_moussa
    jalon: 1
    jour: 75
    lieu: "Koumassi, coin de la ruelle"
    moment: "Nuit"
    objectif: "Moussa, un jeune du quartier que tu as déjà vu chez toi, s'effondre devant toi. Que fais-tu de ce que tu sais ?"
    present: [moussa, sanogo]
    savoir: "Moussa a 24 ans. Il ne répond plus quand tu l'appelles. Le dispensaire de Sanogo est à cinq minutes."
    dialogue:
      - {narr: "Moussa est assis contre un mur, la tête penchée, la respiration lente et irrégulière. Personne dans la ruelle. Ton téléphone sonne dans ta poche."}
      - {qui: sanogo, dit: "Si tu es là, ne le laisse pas seul. Reste avec lui, parle-lui, appelle-moi. Les gestes de base, tu les connais.", si: "flags.suivi_clinique"}
    choix:
      - id: rester_appeler
        l: "Rester avec Moussa, le mettre sur le côté, appeler le docteur Sanogo et les secours"
        intention: "Ne pas laisser quelqu'un mourir seul"
        cout: "Tu seras vu, et on te posera des questions."
        eff: {compromission: -2, flags: [moussa_sauve], relations: {moussa: {trust: 2}, sanogo: {trust: 1}}}
        vers: re_2_princesse_poste
      - id: gestes
        l: "Appliquer les gestes que tu as appris à la clinique, en attendant les secours"
        intention: "Faire tout ce que tu peux, toi-même"
        cout: "Si tu te trompes, tu le vivras longtemps."
        si: "flags.suivi_clinique"
        eff: {compromission: -2, energie: -10}
        tirage:
          difficulte: 4
          issues:
            miracle: {vers: re_2_princesse_poste, eff: {flags: [moussa_sauve], relations: {moussa: {trust: 3}, sanogo: {trust: 2}}}, txt: "Moussa reprend son souffle avant l'arrivée des secours. Sanogo te regarde longtemps, sans rien dire."}
            normal: {vers: re_2_princesse_poste, eff: {flags: [moussa_sauve], relations: {moussa: {trust: 1}}}, txt: "Les secours arrivent à temps. Moussa est emmené, vivant, et tu restes dans la ruelle les mains vides."}
            mauvaise: {vers: re_2_princesse_poste, eff: {flags: [moussa_sauve], sante: -5, relations: {moussa: {trust: 1}}}, txt: "Tu perds du temps à chercher ton téléphone. Les secours arrivent tard, mais Moussa est sauvé. Tu n'oublieras pas ces minutes."}
      - id: partir
        l: "Partir : tu ne peux pas être vu ici"
        intention: "Te protéger"
        cout: "Tu devras le savoir, toute ta vie."
        eff: {compromission: 2, flags: [moussa_perdu], relations: {sanogo: {trust: -2}}}
        vers: re_2_princesse_poste

  - id: re_2_princesse_poste
    jalon: 2
    jour: 110
    carrefour: A
    si: "flags.poste_sekou"
    sinon: re_2_princesse_parole
    lieu: "Yopougon, Rue Princesse"
    moment: "Nuit de fin d'année"
    objectif: "Sékou te met à un poste de revente pendant la grande soirée. Léa apparaît dans la foule."
    present: [sekou, lea]
    savoir: "Léa ne sait pas que tu es là. Si les hommes de Sékou la voient, elle devient un visage qu'ils connaissent."
    dialogue:
      - {narr: "Champagne, sono, poisson braisé. Sékou te place derrière un étal, à la limite de la lumière. Au loin, une silhouette que tu reconnais entre mille, mal à l'aise."}
      - {qui: sekou, dit: "Reste ici. Tu surveilles, tu ne bouges pas. C'est une soirée tranquille, mon frère."}
      - {qui: lea, dit: "Grand frère. Je savais que je te trouverais. Viens, on rentre."}
    choix:
      - id: rester
        l: "Rester à ton poste : tu ne peux pas partir devant Sékou"
        intention: "Ne pas te fâcher avec ceux qui te logent"
        cout: "Léa repart seule, et les hommes de Sékou l'ont vue."
        vu_par: [ombre]
        eff: {compromission: 3, flags: [lea_vue], relations: {lea: {trust: -2}}, factions: {ombre: {reputation: 1}}}
        vers: re_2_travail
      - id: partir_lea
        l: "Partir avec Léa devant tout le monde"
        intention: "Choisir ta sœur"
        cout: "Sékou notera que tu es parti sans lui dire."
        vu_par: [ombre]
        eff: {compromission: -2, flags: [lea_vue], relations: {lea: {trust: 2}, sekou: {peur: 1}}, factions: {ombre: {exposition: 1}}}
        vers: re_2_travail
      - id: expliquer
        l: "Dire à Sékou que tu pars « un quart d'heure », sans promettre de revenir"
        intention: "Sauver la face de tous"
        cout: "Une demi-vérité se vérifie."
        vu_par: [ombre]
        tirage:
          difficulte: 4
          issues:
            miracle: {vers: re_2_travail, eff: {flags: [lea_vue], relations: {lea: {trust: 1}}}, txt: "Sékou sourit, te laisse partir. Léa te prend le bras sans un mot."}
            normal: {vers: re_2_travail, eff: {compromission: 1, flags: [lea_vue]}, txt: "Sékou hausse les épaules : « Reviens vite. » Léa et toi marchez en silence."}
            mauvaise: {vers: re_2_travail, eff: {compromission: 2, flags: [lea_vue], relations: {lea: {trust: -1}}}, txt: "Sékou te retient par la manche : « Ta sœur, elle est mignonne. » Léa le regarde, sans comprendre."}

  - id: re_2_princesse_parole
    jalon: 2
    jour: 110
    carrefour: A
    si: "flags.groupe"
    sinon: re_2_princesse_entre
    lieu: "Yopougon, Rue Princesse"
    moment: "Nuit de fin d'année"
    objectif: "Le groupe de parole est venu à la soirée : Fatou y est avec un micro. Tu peux dire ou ne pas dire."
    present: [sanogo, fatou, lea]
    savoir: "Fatou ne cherche pas ton histoire pour la vendre. Elle cherche des voix de quartier."
    dialogue:
      - {narr: "Dans un coin du maquis, une table longue, des chaises dépareillées. Le groupe de parole est venu en groupe, sans bruit. Fatou, un micro éteint à la main, s'assoit près de toi."}
      - {qui: fatou, dit: "Pas besoin de dire ton nom. Mais si tu as quelque chose à dire, la radio l'entendra."}
      - {qui: sanogo, dit: "Tu n'as pas à le faire. Tu peux aussi seulement écouter ce soir."}
    choix:
      - id: parole
        l: "Raconter ton histoire à la radio, sous un autre nom"
        intention: "Que d'autres sachent qu'on peut s'en sortir"
        cout: "Ceux qui te connaissent reconnaîtront ta voix."
        eff: {compromission: -2, flags: [parole_publique], relations: {fatou: {trust: 2}, sanogo: {trust: 1}, lea: {trust: 1}}}
        vers: re_2_travail
      - id: ecouter
        l: "Écouter seulement, ce soir"
        intention: "Prendre ta place sans te dévoiler"
        cout: "Tu portes encore ton histoire seul."
        eff: {relations: {sanogo: {trust: 1}}}
        vers: re_2_travail
      - id: partir_soiree
        l: "Quitter la soirée : trop de monde, trop de bruit"
        intention: "Te protéger"
        cout: "Léa te regarde partir."
        eff: {relations: {lea: {trust: -1}}}
        vers: re_2_travail

  - id: re_2_princesse_entre
    jalon: 2
    jour: 110
    carrefour: A
    lieu: "Yopougon, Rue Princesse"
    moment: "Nuit de fin d'année"
    objectif: "Tu as tenu quelques semaines. Léa en est heureuse. Sékou t'envoie un message."
    present: [lea]
    savoir: "Tu as tenu. Un message de Sékou vibre dans ta poche : « On a besoin de toi. »"
    dialogue:
      - {narr: "Lumières, sono, odeur de poisson braisé. Léa te serre le bras, fière, sans le dire. Dans ta poche, le téléphone vibre."}
      - {qui: lea, dit: "Tu vois ? Tu as tenu. Tu n'as pas besoin de lui."}
    choix:
      - id: ignorer
        l: "Ignorer le message et aller voir le docteur Sanogo demain"
        intention: "Rester sur ta ligne"
        cout: "Sékou aura noté ton silence."
        vu_par: [ombre]
        eff: {compromission: -2, flags: [suivi_clinique], relations: {sanogo: {trust: 1}, lea: {trust: 1}}, factions: {ombre: {exposition: 1}}}
        vers: re_2_travail
      - id: repondre
        l: "Répondre à Sékou : « Je t'appelle demain »"
        intention: "Ne pas te fâcher"
        cout: "Tu ouvres une porte que tu avais fermée."
        vu_par: [ombre]
        eff: {compromission: 2, relations: {sekou: {trust: 1}, lea: {trust: -1}}}
        vers: re_2_travail
      - id: montrer_lea
        l: "Montrer le message à Léa et décider avec elle"
        intention: "Ne plus rien cacher"
        cout: "Léa pourrait te dire des choses que tu ne veux pas entendre."
        eff: {relations: {lea: {trust: 2}}, compromission: -1}
        vers: re_2_travail

  - id: re_2_travail
    jalon: 2
    jour: 190
    lieu: "Koumassi, étal de la famille et clinique"
    moment: "Saison sèche, matin"
    objectif: "Gagner de quoi vivre sans retomber : un relais auprès des anciens clients, un travail, ou la même route."
    present: [lea, sanogo]
    savoir: "Sanogo cherche quelqu'un qui connaisse le quartier, sans juger. Léa a besoin d'aide à l'étal."
    dialogue:
      - {qui: sanogo, dit: "Je cherche quelqu'un qui connaisse les gens, qui n'a pas honte de s'asseoir à côté d'eux. Je ne peux pas payer beaucoup. Mais je peux payer."}
      - {qui: lea, dit: "L'étal a besoin d'un bras le matin. C'est peu, mais c'est honnête."}
    choix:
      - id: relais
        l: "Devenir relais auprès des anciens clients, à la clinique de Sanogo"
        intention: "Utiliser ce que tu connais pour limiter les dégâts"
        cout: "Revoir ceux que tu as vus à tes pires moments."
        eff: {compromission: -2, flags: [pair_aidant], energie: -10, relations: {sanogo: {trust: 2}, moussa: {trust: 1}}}
        vers: re_3_crue_poste
      - id: etal
        l: "Aider Léa à l'étal de leur mère, le matin"
        intention: "Un travail modeste, pour tenir"
        cout: "Peu de revenu, et pas de gloire."
        eff: {argent: 30000, relations: {lea: {trust: 2}}}
        vers: re_3_crue_poste
      - id: continuer
        l: "Continuer le poste de Sékou, en attendant mieux"
        intention: "Ne pas perdre ton revenu"
        cout: "Chaque jour là-dedans est un jour où tu risques de retomber."
        si: "flags.poste_sekou"
        vu_par: [ombre]
        eff: {compromission: 2, relations: {sekou: {trust: 1}, lea: {trust: -1}}, factions: {ombre: {reputation: 1}}}
        vers: re_3_crue_poste
      - id: attendre
        l: "Ne rien décider et voir venir"
        intention: "Gagner du temps"
        cout: "Le temps ne t'attend pas."
